# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "boole_main" ]
  pull_request:
    branches: [ "boole_main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true
    - name: Install Meson & Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip ninja-build
        pip install meson
    - name: Clone cangjie binary repository
      uses: GuillaumeFalourd/clone-github-repo-action@v2.3
      with:
        owner: 'Huawei-Edinburgh-Programming-Languages'
        repository: 'cj-sdk-mirror'
        access-token: ${{ secrets.ACCESS_TOKEN }}
    - name: More git setup
      run: |
        BRANCH="${{ github.head_ref || github.ref_name }}"
        git submodule update --remote
        cd external
        BRANCH=$(git ls-remote --exit-code --heads origin ${BRANCH} &>/dev/null && echo "${BRANCH}" || echo "boole_main")
        git fetch origin ${BRANCH}:${BRANCH} --depth=1 && git switch ${BRANCH}
    - name: Authenticate NPM repositories
      run: echo registry=https://repo.huaweicloud.com/repository/npm/ > ~/.npmrc ;
           echo @ohos:registry=https://repo.harmonyos.com/npm/ >> ~/.npmrc ;
           echo strict-ssl=false >> ~/.npmrc ;
           echo lockfile=false >> ~/.npmrc ;
           echo @idlizer:registry=https://nexus.cn.bz-openlab.ru:10443/repository/koala-npm/ >> ~/.npmrc ;
           echo @koalaui:registry=https://nexus.cn.bz-openlab.ru:10443/repository/koala-npm/ >> ~/.npmrc ;
           echo @panda:registry=https://nexus.cn.bz-openlab.ru:10443/repository/koala-npm/ >> ~/.npmrc ;
           echo '//nexus.cn.bz-openlab.ru:10443/repository/koala-npm/:_auth=${{ secrets.NPM_TOKEN }}' >> ~/.npmrc
    # - name: Use Node.js ${{ matrix.node-version }}
    #   uses: actions/setup-node@v4
    #   with:
    #     node-version: ${{ matrix.node-version }}
    #     cache: 'npm'
    - name: npm install
      run: npm i --verbose --no-audit && cd external && npm i
    - name: dtsgen
      run: cd dtsgen && npm run compile
    - name: Extract cj sdk
      run: tar -xzf cj-sdk-mirror/cangjie-sdk-linux-x64-1.0.1.tar.gz -C ~
    - name: arkgen
      run: source ~/cangjie/envsetup.sh && cd arkgen && npm run clean && npm run all:subset:cj && npm run clean && npm run all:boole:demo1:cj
