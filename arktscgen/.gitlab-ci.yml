build idlize-arktscgen:
  stage: build
  tags:
    - idlize-ci
    - koala-ci
  before_script:
    - !reference [.setup, script]
    - cd $CI_PROJECT_DIR/arktscgen
  script:
    - npm run compile

test arktscgen:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  before_script:
    - !reference [.setup, script]
    - cd $CI_PROJECT_DIR
    - PANDA_SDK_VERSION=next npm run --prefix ./external/incremental/tools/panda panda:sdk:install
    - cd arktscgen
  script:
    - npm run all --prefix arktscgen

pack idlize-arktscgen:
  extends:
    - .npm-pack
  variables:
    PACKAGE_DIR: arktscgen
  needs:
    - build idlize-arktscgen

pre-publish test arktscgen:
  stage: pre-publish
  tags:
    - idlize-ci
    - koala-ci
  before_script:
    - !reference [ .setup, script ]
  script:
    - cd $CI_PROJECT_DIR/arktscgen
    - npm pack
    - cd ../
    - npx --yes ./arktscgen/idlizer-arktscgen-*.tgz \
      --panda-sdk-path ./external/incremental/tools/panda/node_modules/@panda/sdk \
      --output-dir .
    - cd libarkts
    - npm i
    - npm run compile
  needs:
    - build idlize-arktscgen

publish idlize-arktscgen:
  extends:
    - .npm-publish
  variables:
    PACKAGE_DIR: arktscgen
  dependencies:
    - build idlize-arkgen
